<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <meta charset="UTF-8">
    <title>Track in</title>
</head>

<body class="flex flex-col min-h-screen">
<!-- Header -->
<div th:replace="~{fragments/layout :: header}"></div>

<!-- Conteúdo principal -->
<div class="flex-grow">

        <div class="flex-grow">
            <div class="container mx-auto space-y-8 p-6">

                <div th:if="${message}" role="alert" class="alert alert-success alert-soft m-4">
                    <span th:text="${message}"></span>
                </div>

                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold"  th:text="#{dashboard.title}"></h1>
                    <div class="flex gap-2">
                        <a href="/evento" class="btn btn-primary btn-sm"  th:text="#{evento.info}"></a>
                    </div>
                </div>

                <!-- Indicadores -->
                <div class="grid grid-cols-4 gap-4">
                    <div class="card p-4 border-2 border-primary">
                        <h2  th:text="#{dashboard.motosCadastradas}"></h2>
                        <p th:text="${totalMotos}">0</p>
                    </div>
                    <div class="card p-4 border-2 border-primary">
                        <h2 th:text="#{dashboard.eventosRegistrados}"></h2>
                        <p th:text="${totalEventos}">0</p>
                    </div>
                    <div class="card p-4 border-2 border-primary">
                        <h2 th:text="#{dashboard.motosEmManutencao}"></h2>
                        <p th:text="${emManutencao}">0</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Lista de motos -->
    <div class="card bg-base-100 shadow-md w-full">
        <div class="flex items-center justify-between p-4 border-b border-base-200">
            <h2 class="text-2xl font-bold text-primary p-4" th:text="#{dashboard.motosCadastradas}"></h2>
            <a href="moto/formMoto" class="btn btn-sm btn-primary"  th:text="#{moto.new}"></a>
        </div>
        <ul class="list bg-base-100 rounded-b-box p-4 space-y-2">
            <li th:each="moto : ${motos}" class="flex items-center justify-between p-3 bg-base-200 rounded-md shadow-sm">
                <div>
                    <p class="py-1 font-semibold">
                        <span th:text="${moto.placa}"></span> -
                        <span th:text="${moto.modelo}"></span> -
                        <span th:text="${moto.ano}"></span> -
                        <span th:text="'ID patio: ' + ${moto.patio.id}"></spam> </span>
                    </p>
                    <p class="py-1 text-xs uppercase font-semibold opacity-60">
                        <span th:text="#{moto.ultimaManutencao}"></span>:
                        <span th:text="${moto.ultimaManutencao}"></span>
                    </p>
                </div>


                <div class="flex justify-end gap-4 mt-4">
                    <!-- Dropdown de Status -->
                    <div class="dropdown dropdown-end">
                        <button tabindex="0" class="btn btn-neutral" th:text="#{status}"></button>
                        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-52 p-2 shadow">
                            <li>
                                <form method="post" th:action="@{'/moto/manutencao/' + ${moto.id}}">
                                    <input type="hidden" name="_method" value="PUT" />
                                    <button class="  font-semibold hover:text-yellow-800">
                                        🛠️ <span th:text="#{moto.status.manutencao}"></span>
                                    </button>
                                </form>
                            </li>
                            <li>
                                <form method="post" th:action="@{'/moto/disponivel/' + ${moto.id}}">
                                    <input type="hidden" name="_method" value="PUT" />
                                    <button class=" font-semibold hover:text-green-800">
                                        ✅ <span th:text="#{moto.status.disponivel}"></span>
                                    </button>
                                </form>
                            </li>
                            <li>
                                <form method="post" th:action="@{'/moto/alugada/' + ${moto.id}}">
                                    <input type="hidden" name="_method" value="PUT" />
                                    <button class=" font-semibold hover:text-blue-800">
                                        🚚 <span th:text="#{moto.status.alugada}"></span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                    <!-- Dropdown de Ações -->
                    <div class="dropdown dropdown-end">
                        <button tabindex="0" class="btn btn-outline" th:text="#{actions}"></button>
                        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-48 p-2 shadow">
                            <li>
                                <a th:href="@{'/moto/formMoto/' + ${moto.id}}" class="font-semibold hover:text-blue-800">
                                     <span th:text="#{edit}"></span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{'/moto/' + ${moto.id}}" class="font-semibold hover:text-yellow-800">
                                    <span th:text="#{details}"></span>
                                </a>
                            </li>
                            <li>
                                <form method="post" th:action="${'/moto/' + moto.id}">
                                    <input type="hidden" name="_method" value="DELETE" />
                                    <button class="font-semibold hover:text-red-800">
                                        🗑️ <span th:text="#{delete}"></span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                </div>

            </li>
        </ul>
    </div>
</div>


<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
